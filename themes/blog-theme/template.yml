jtex: v1
title: Blog Theme
description: A mystmd site theme tuned for blogs. Forked from book-theme — adds a non-dismissible site `header` part, optional navbar, and theme pinning.
version: 0.1.0
license: MIT
source: https://github.com/espg/myst-theme
thumbnail: ./thumbnail.png
authors:
  - name: Shane Grigsby
    email: refuge@rocktalus.com
  - name: Rowan Cockett
    website: https://curvenote.com
    affiliations:
      - Curvenote
tags:
  - blog
  - book
options:
  - type: boolean
    id: hide_toc
    description: Hide the table of contents
  - type: boolean
    id: hide_footer_links
    description: Hide the previous/next links in the footer
  - type: boolean
    id: hide_outline
    description: Hide the document outline on all pages
  - type: boolean
    id: hide_title_block
    description: Hide the document title on all pages
  - type: boolean
    id: hide_authors
    description: Hide the authors list on all pages
  - type: boolean
    id: hide_search
    description: Disable the search
  - type: number
    id: outline_maxdepth
    description: The maximum depth to show on the document outline, for example, `2` would show only two depths of headings (e.g. `<H1>` and `<H2>`)
    min: 1
    max: 6
    integer: true
  - type: string
    id: twitter
    description: Twitter handle related to the site
  - type: file
    id: favicon
    description: Local path to favicon image
  - type: file
    id: logo
    description: Local path to logo image
  - type: file
    id: logo_dark
    description: Local path to logo image for dark mode
  - type: string
    id: logo_text
    description: Short text to display next to logo at the top of all pages
  - type: string
    id: logo_url
    description: If specified, link logo to this URL. Otherwise, point to root page.
  - type: string
    id: logo_alt
    description: Alt text to attach to the logo
  - type: string
    id: analytics_google
    description: Google analytics key
  - type: string
    id: analytics_plausible
    description: Plausible analytics key
  - type: boolean
    id: numbered_references
    description: Show references as numbered, rather than in APA-style. Only applies to parenthetical citations
  - type: boolean
    id: folders
    description: Respect nested folder structure in URL paths
  - type: string
    id: internal_domains
    description: >-
      A domain to treat as internal links (no external icon, opens in same tab).
      Supports wildcard subdomains with *. Example: "jupyter.org" or "*.jupyter.org"
  - type: file
    id: style
    description: Local path to a CSS file
  # ─── blog-theme additions (espg/myst-theme fork) ────────────────────────
  - type: boolean
    id: hide_navbar
    description: >-
      Hide the entire top navbar (logo + nav + search + theme toggle + actions).
      The PrimaryNavigation sidebar is independent and still renders.
  - type: string
    id: pin_theme
    description: >-
      Force the page to render in 'light' or 'dark' theme regardless of the
      user's system preference. If unset, follows prefers-color-scheme as
      before.
parts:
  - id: footer
    description: The site wide footer
    required: false
  - id: primary_sidebar_footer
    description: The primary sidebar footer, to replace Made with MyST
    required: false
  - id: navbar_end
    description: Custom content displayed at the end of the top navbar
    required: false
  # ─── blog-theme addition (espg/myst-theme fork) ─────────────────────────
  - id: header
    description: >-
      Site-wide header content rendered above the navbar. Unlike the built-in
      `banner` part, this is NOT dismissible — intended for permanent brand
      strips, image banners, or affiliation marks.
    required: false
build:
  # Full install + workspace build + theme prod build. The cd to workspace
  # root is required so:
  #   1. patch-package (a root devDependency) is available when the root
  #      postinstall fires — without it, @jupyter-widgets CSS imports break
  #      the remix build.
  #   2. `npm run build` at root runs turbo, which builds every workspace
  #      package (myst-to-react, @myst-theme/site, etc.) — their dist/
  #      files need to exist before remix can bundle the theme app.
  # After both finish, cd back into the theme dir for prod:build.
  install: cd ../.. && npm install --legacy-peer-deps && npm run build && cd themes/blog-theme && npm run prod:build
  start: npm run start
files:
  - server.js
  - package.json
  # public/** and build/** are produced by `npm run prod:build` (called from
  # build.install above) — they are NOT in the repo. Listing them here would
  # cause mystmd's template validation to fail before the install step has
  # had a chance to create them. mystmd's static-html crawler still copies
  # all of public/ into the output regardless of this list.
